{% extends "base.html" %}
{% block title %}Register — JC-Ride{% endblock %}
{% block content %}
<section class="card">
  <h2>Create Account</h2>
  <form method="post" class="form">
    <label>Full Name <input type="text" name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <label>I want to
      <select name="role">
        <option value="rider">Ride as a passenger</option>
        <option value="driver">Drive and earn</option>
      </select>
    </label>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
  <p class="form-footer">Already have an account? <a href="{{ url_for('main.login_page') }}">Sign In</a></p>
</section>
{% endblock %}
