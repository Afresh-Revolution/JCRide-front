<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Rider Portal — JCRide NAIJA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user-dashboard.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="user-body">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="user-flash-container">
        {% for category, message in messages %}
          <div class="user-flash user-flash--{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
