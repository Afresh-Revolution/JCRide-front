<aside class="user-sidebar" id="user-sidebar" aria-label="Rider navigation">
  {% from "includes/brand_assets.html" import brand_mark %}
  <div class="user-sidebar__brand">
    <div class="user-sidebar__logo" aria-hidden="true">
      {{ brand_mark('user-sidebar__logo-img', 36) }}
    </div>
    <div class="user-sidebar__brand-text">
      <span class="user-sidebar__brand-name">JosRide <span class="user-sidebar__brand-naija">NAIJA</span></span>
      <span class="user-sidebar__badge">RIDER</span>
    </div>
  </div>

  <nav class="user-sidebar__nav">
    <a href="{{ url_for('main.user_dashboard') }}" class="user-nav-item{% if active_page == 'dashboard' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="{{ url_for('main.user_book_ride') }}" class="user-nav-item{% if active_page == 'book_ride' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Book Ride
    </a>
    <a href="{{ url_for('main.user_schedule_ride') }}" class="user-nav-item{% if active_page == 'schedule_ride' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Schedule Ride
    </a>
    <a href="{{ url_for('main.user_live_tracking') }}" class="user-nav-item{% if active_page == 'live_tracking' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Live Tracking
    </a>
    <a href="{{ url_for('main.user_ride_history') }}" class="user-nav-item{% if active_page == 'ride_history' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Ride History
    </a>
    <a href="{{ url_for('main.user_wallet') }}" class="user-nav-item{% if active_page == 'wallet' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      Wallet
    </a>
    <span class="user-nav-item user-nav-item--soon" aria-disabled="true" title="Coming soon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notifications
    </span>
    <a href="{{ url_for('main.user_profile') }}" class="user-nav-item{% if active_page == 'profile' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
    <a href="{{ url_for('main.user_settings') }}" class="user-nav-item{% if active_page == 'settings' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
    <a href="{{ url_for('main.user_support') }}" class="user-nav-item{% if active_page == 'support' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Support
    </a>
  </nav>

  <div class="user-sidebar__help">
    <p class="user-sidebar__help-title">Need help?</p>
    <p class="user-sidebar__help-sub">24/7 Support team</p>
    <a href="{{ url_for('main.user_support') }}" class="user-sidebar__help-btn">Contact us</a>
  </div>
</aside>
