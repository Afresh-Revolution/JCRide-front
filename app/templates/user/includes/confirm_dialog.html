<div class="user-confirm-overlay" id="user-confirm-overlay" hidden>
  <div class="user-confirm" role="alertdialog" aria-labelledby="user-confirm-title" aria-describedby="user-confirm-message" aria-modal="true">
    <div class="user-confirm__header">
      <h2 class="user-confirm__title" id="user-confirm-title">Confirm action</h2>
      <button type="button" class="user-confirm__close" data-user-confirm-cancel aria-label="Close">&times;</button>
    </div>
    <div class="user-confirm__body">
      <p class="user-confirm__message" id="user-confirm-message"></p>
    </div>
    <div class="user-confirm__footer">
      <button type="button" class="user-confirm__btn user-confirm__btn--ghost" data-user-confirm-cancel id="user-confirm-cancel">Cancel</button>
      <button type="button" class="user-confirm__btn user-confirm__btn--primary" id="user-confirm-btn">Confirm</button>
    </div>
  </div>
</div>
