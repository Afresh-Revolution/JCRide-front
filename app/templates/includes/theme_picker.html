<p class="settings-theme__lead">Choose how JosRide looks. Your choice is saved on this device until you change it.</p>
<div class="settings-theme" role="radiogroup" aria-label="Theme">
  <button type="button" class="settings-theme__option" data-theme-option="light" role="radio" aria-checked="false">
    <span class="settings-theme__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M4.93 4.93l1.06 1.06M18.01 18.01l1.06 1.06M3 12h1.5M19.5 12H21M4.93 19.07l1.06-1.06M18.01 5.99l1.06-1.06"/></svg>
    </span>
    <span class="settings-theme__copy">
      <strong>Light theme</strong>
      <span>Bright backgrounds and dark text</span>
    </span>
    <span class="settings-theme__check" aria-hidden="true">
      <svg class="settings-theme__check-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.7-4.7 1.4 1.4-6.1 6.1z"/></svg>
      <svg class="settings-theme__check-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><circle cx="12" cy="12" r="9"/></svg>
    </span>
  </button>
  <button type="button" class="settings-theme__option" data-theme-option="dark" role="radio" aria-checked="false">
    <span class="settings-theme__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
    <span class="settings-theme__copy">
      <strong>Dark theme</strong>
      <span>Dim backgrounds that are easier at night</span>
    </span>
    <span class="settings-theme__check" aria-hidden="true">
      <svg class="settings-theme__check-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.7-4.7 1.4 1.4-6.1 6.1z"/></svg>
      <svg class="settings-theme__check-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><circle cx="12" cy="12" r="9"/></svg>
    </span>
  </button>
  <button type="button" class="settings-theme__option" data-theme-option="system" role="radio" aria-checked="false">
    <span class="settings-theme__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    </span>
    <span class="settings-theme__copy">
      <strong>Device theme</strong>
      <span>Match your phone light or dark setting</span>
    </span>
    <span class="settings-theme__check" aria-hidden="true">
      <svg class="settings-theme__check-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.7-4.7 1.4 1.4-6.1 6.1z"/></svg>
      <svg class="settings-theme__check-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" width="22" height="22"><circle cx="12" cy="12" r="9"/></svg>
    </span>
  </button>
</div>
<p class="settings-theme__note" data-theme-note></p>
