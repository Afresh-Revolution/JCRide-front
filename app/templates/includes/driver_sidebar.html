{# Reusable driver portal sidebar — pass active_nav: dashboard | requests | active_trip | earnings | notifications | profile | settings #}
<aside class="admin-sidebar" id="{{ sidebar_id|default('driver-sidebar') }}" aria-label="Driver navigation">
  <div class="admin-sidebar__brand">
    <div class="admin-sidebar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17h10M5 11l1.5-4h11L19 11"/>
        <circle cx="7.5" cy="17" r="2"/>
        <circle cx="16.5" cy="17" r="2"/>
        <path d="M5 11h14"/>
      </svg>
    </div>
    <div class="admin-sidebar__brand-text">
      <span class="admin-sidebar__brand-name">JCRide <span class="admin-sidebar__brand-naija">NAIJA</span></span>
      <span class="admin-sidebar__badge">DRIVER</span>
    </div>
  </div>

  <nav class="admin-sidebar__nav">
    <a href="{{ url_for('driver_portal.dashboard') }}" class="admin-nav-item{% if active_nav == 'dashboard' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="{{ url_for('driver_portal.ride_requests') }}" class="admin-nav-item{% if active_nav == 'requests' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Ride Requests
    </a>
    <a href="{{ url_for('driver_portal.active_trip') }}" class="admin-nav-item{% if active_nav == 'active_trip' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Active Trip
    </a>
    <a href="{{ url_for('driver_portal.earnings') }}" class="admin-nav-item{% if active_nav == 'earnings' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Earnings
    </a>
    <a href="{{ url_for('driver_portal.notifications') }}" class="admin-nav-item{% if active_nav == 'notifications' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notifications
    </a>
    <a href="{{ url_for('driver_portal.profile') }}" class="admin-nav-item{% if active_nav == 'profile' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
    <a href="{{ url_for('driver_portal.support') }}" class="admin-nav-item{% if active_nav == 'support' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Support
    </a>
    <a href="{{ url_for('driver_portal.settings') }}" class="admin-nav-item{% if active_nav == 'settings' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <a href="{{ url_for('driver_portal.logout') }}" class="admin-sidebar__logout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    <span>Log out</span>
  </a>
</aside>
