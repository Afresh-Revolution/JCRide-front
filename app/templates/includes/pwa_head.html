{# JosRide PWA - manifest, icons, splash, meta #}

{% macro pwa_head() -%}
<script>
(function(){var d=window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: window-controls-overlay)').matches||window.navigator.standalone===true;if(d)document.documentElement.classList.add('is-pwa');})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="{{ static_url('pwa/icons/icon-192.png') }}" as="image" type="image/png">
<link rel="preload" href="{{ static_url('css/pwa-shell.css') }}" as="style">
<meta name="application-name" content="JosRide">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JosRide">
<meta name="msapplication-TileColor" content="#065f46">
<meta name="msapplication-config" content="/browserconfig.xml">
<meta name="theme-color" content="#065f46" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#065f46" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">

<link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('pwa/icons/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ static_url('pwa/icons/favicon-16.png') }}">
<link rel="icon" href="{{ static_url('pwa/icons/icon-192.png') }}" type="image/png">

<link rel="apple-touch-icon" sizes="180x180" href="{{ static_url('pwa/icons/apple-touch-icon-180.png') }}">
<link rel="apple-touch-icon" sizes="167x167" href="{{ static_url('pwa/icons/apple-touch-icon-167.png') }}">
<link rel="apple-touch-icon" sizes="152x152" href="{{ static_url('pwa/icons/apple-touch-icon-152.png') }}">

<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="{{ static_url('pwa/icons/icon-512.png') }}">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="{{ static_url('pwa/icons/icon-512.png') }}">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="{{ static_url('pwa/icons/icon-512.png') }}">

<link rel="stylesheet" href="{{ static_url('css/pwa-shell.css') }}">
<link rel="stylesheet" href="{{ static_url('css/pwa-install.css') }}">
<link rel="stylesheet" href="{{ static_url('css/scroll-to-top.css') }}">
{%- endmacro %}

{% macro pwa_body_start() -%}
{% from "includes/pwa_boot.html" import pwa_boot_shell %}
{{ pwa_boot_shell() }}
<script src="{{ static_url('js/pwa-boot.js') }}"></script>
{%- endmacro %}

{% macro pwa_scripts() -%}
<script src="{{ static_url('js/pwa-register.js') }}" defer></script>
<script src="{{ static_url('js/pwa-install.js') }}" defer></script>
<script src="{{ static_url('js/scroll-to-top.js') }}" defer></script>
{%- endmacro %}
