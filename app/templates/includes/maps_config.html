{# Shared Google Maps / Leaflet bootstrap for rider, driver, and admin maps.
   Key: EXPO_PUBLIC_GOOGLE_MAPS_API_KEY from JCRide-back/.env or JCRide-front/.env #}
<script type="application/json" id="josride-maps-config">{{ {
  "googleMapsApiKey": google_maps_api_key or "",
  "envVar": "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY",
  "hasGoogleMaps": has_google_maps|default(false)
} | tojson }}</script>
<script src="{{ url_for('static', filename='js/josride-maps.js') }}"></script>
{% if has_google_maps %}
<script>
  // Warm Google Maps early, but do not swallow auth errors into a poisoned promise.
  if (window.JosRideMaps && window.JosRideMaps.hasGoogle) {
    window.JosRideMaps.loadGoogle().catch(function (err) {
      if (typeof console !== "undefined" && console.warn) {
        console.warn("[JosRideMaps] preload:", err && err.message ? err.message : err);
      }
    });
  }
</script>
{% else %}
<script>
  if (typeof console !== "undefined" && console.warn) {
    console.warn("[JosRideMaps] No EXPO_PUBLIC_GOOGLE_MAPS_API_KEY — using Leaflet fallback.");
  }
</script>
{% endif %}
