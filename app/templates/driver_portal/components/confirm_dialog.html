<div class="driver-confirm-overlay" id="driver-confirm-overlay" hidden>
  <div class="driver-confirm" role="alertdialog" aria-labelledby="driver-confirm-title" aria-describedby="driver-confirm-message" aria-modal="true">
    <div class="driver-confirm__header">
      <h2 class="driver-confirm__title" id="driver-confirm-title">Confirm action</h2>
      <button type="button" class="driver-confirm__close" data-driver-confirm-cancel aria-label="Close">&times;</button>
    </div>
    <div class="driver-confirm__body">
      <p class="driver-confirm__message" id="driver-confirm-message"></p>
    </div>
    <div class="driver-confirm__footer">
      <button type="button" class="driver-confirm__btn driver-confirm__btn--ghost" data-driver-confirm-cancel id="driver-confirm-cancel">Cancel</button>
      <button type="button" class="driver-confirm__btn driver-confirm__btn--primary" id="driver-confirm-btn">Confirm</button>
    </div>
  </div>
</div>
