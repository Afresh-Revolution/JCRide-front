{# Reusable text input — used by login & register forms #}
{% macro input_field(label, name, type='text', placeholder='', value='', required=true) %}
<label class="field">
  <span class="field__label">{{ label }}</span>
  <input
    class="field__input"
    type="{{ type }}"
    name="{{ name }}"
    placeholder="{{ placeholder }}"
    value="{{ value }}"
    {% if required %}required{% endif %}
  >
</label>
{% endmacro %}
