{# Single ride request card #}
<article class="ride-request-card">
  <div class="ride-request-card__top">
    <div class="ride-request-card__rider">
      <div class="ride-request-card__avatar">{{ request.rider_initials }}</div>
      <div>
        <div class="ride-request-card__name">{{ request.rider_name }}</div>
        <div class="ride-request-card__meta">
          <span class="ride-request-card__rating">★ {{ request.rating }}</span>
          <span>{{ request.distance_km }} km · {{ request.duration_min }} min</span>
        </div>
      </div>
    </div>
    <div class="ride-request-card__earn">
      <span class="ride-request-card__earn-label">YOU EARN</span>
      <span class="ride-request-card__earn-value">{{ request.earnings }}</span>
    </div>
  </div>

  <span class="ride-request-card__badge">{{ request.pickup_eta }}</span>

  <div class="ride-request-card__route">
    <div class="ride-request-card__stop">
      <span class="ride-request-card__dot ride-request-card__dot--pickup"></span>
      <div>
        <span class="ride-request-card__stop-label">PICKUP</span>
        <span class="ride-request-card__stop-value">{{ request.pickup }}</span>
      </div>
    </div>
    <div class="ride-request-card__stop">
      <span class="ride-request-card__dot ride-request-card__dot--dest"></span>
      <div>
        <span class="ride-request-card__stop-label">DESTINATION</span>
        <span class="ride-request-card__stop-value">{{ request.destination }}</span>
      </div>
    </div>
  </div>

  <div class="ride-request-card__actions">
    <form method="post" action="{{ url_for('driver_portal.reject_ride', request_id=request.id) }}">
      <button type="submit" class="driver-btn driver-btn--outline">Reject</button>
    </form>
    <form method="post" action="{{ url_for('driver_portal.accept_ride', request_id=request.id) }}">
      <button type="submit" class="driver-btn driver-btn--primary">Accept ride</button>
    </form>
  </div>
</article>
