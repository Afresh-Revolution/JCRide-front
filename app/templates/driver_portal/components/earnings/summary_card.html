{# Earnings summary KPI card #}
<article class="earnings-summary-card earnings-summary-card--{{ card.id }}">
  <div class="earnings-summary-card__head">
    <span class="earnings-summary-card__label">{{ card.label }}</span>
    <span class="earnings-summary-card__icon earnings-summary-card__icon--{{ card.icon }}" aria-hidden="true">
      {% if card.icon == 'wallet' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      {% elif card.icon == 'trend' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      {% elif card.icon == 'calendar' %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      {% else %}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/></svg>
      {% endif %}
    </span>
  </div>
  <p class="earnings-summary-card__value">{{ card.value }}</p>
  {% if card.badge %}
    <span class="earnings-summary-card__badge">{{ card.badge }}</span>
  {% endif %}
</article>
