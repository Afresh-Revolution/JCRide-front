{# Nearby demand map card #}
<article class="panel panel--map">
  <div class="panel__header">
    <div>
      <h3 class="panel__title">Nearby demand</h3>
      <p class="panel__subtitle">High demand in {{ demand.zone }}</p>
    </div>
  </div>

  <div class="map-preview">
    <div class="map-preview__grid"></div>
    <span class="map-preview__badge">Surge zones</span>
    <div class="map-preview__zoom">
      <button type="button">+</button>
      <button type="button">−</button>
    </div>
  </div>

  <a href="#" class="btn btn--primary btn--block map-preview__cta">
    View {{ demand.new_requests }} new requests
  </a>
</article>
