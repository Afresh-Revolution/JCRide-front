{# Weekly earnings line chart card #}
<article class="panel panel--chart">
  <div class="panel__header">
    <div>
      <h3 class="panel__title">Weekly earnings</h3>
      <p class="panel__subtitle">{{ weekly.total }} this week · <span class="text-success">{{ weekly.trend }}</span></p>
    </div>
    <button type="button" class="driver-btn driver-btn--ghost">📈 Trend</button>
  </div>
  <div class="panel__body">
    <canvas id="earningsChart" height="220"></canvas>
  </div>
  <script>
    window.weeklyEarnings = {
      labels: {{ weekly.labels | tojson }},
      values: {{ weekly.values | tojson }}
    };
  </script>
</article>
