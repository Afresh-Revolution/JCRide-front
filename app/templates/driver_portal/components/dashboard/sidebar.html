{# Left sidebar navigation #}
<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__icon">🚗</span>
    <div>
      <div class="sidebar__name">JCRide <span class="sidebar__naija">NAIJA</span></div>
      <span class="sidebar__badge">DRIVER</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    {% for item in nav_items %}
      <a
        href="{{ url_for(item.url) if item.url != '#' else '#' }}"
        class="sidebar__link {% if item.id == active_nav %}sidebar__link--active{% endif %}"
      >
        <span class="sidebar__link-icon sidebar__link-icon--{{ item.icon }}"></span>
        {{ item.label }}
      </a>
    {% endfor %}
  </nav>

  <div class="sidebar__support">
    <p class="sidebar__support-title">Need help?</p>
    <p class="sidebar__support-text">24/7 Support team</p>
    <button type="button" class="btn btn--light btn--block">Contact us</button>
  </div>

  <a href="{{ url_for('driver_portal.logout') }}" class="sidebar__logout">↪ Log out</a>
</aside>
