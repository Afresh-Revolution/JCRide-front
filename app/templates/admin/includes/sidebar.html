<aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
  {% from "includes/brand_assets.html" import brand_mark %}
  <div class="admin-sidebar__brand">
    <div class="admin-sidebar__logo" aria-hidden="true">
      {{ brand_mark('admin-sidebar__logo-img', 36) }}
    </div>
    <div class="admin-sidebar__brand-text">
      <span class="admin-sidebar__brand-name">JosRide <span class="admin-sidebar__brand-naija">NAIJA</span></span>
      <span class="admin-sidebar__badge">ADMIN</span>
    </div>
  </div>

    <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-item{% if active_page == 'dashboard' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="{{ url_for('admin.users') }}" class="admin-nav-item{% if active_page == 'users' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      SOS Alerts
    </a>
    <a href="{{ url_for('admin.accidents_page') }}" class="admin-nav-item{% if active_page == 'accidents' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>

      Payments

    <a href="{{ url_for('admin.reports_page') }}" class="admin-nav-item{% if active_page == 'reports' %} is-active{% endif %}">

    <a href="{{ url_for('admin.settings_page') }}" class="admin-nav-item{% if active_page == 'settings' %} is-active{% endif %}">
