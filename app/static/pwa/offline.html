<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#065f46">
  <title>Offline - JosRide</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --green: #065f46;
      --green-light: #ecfdf5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --green-light: rgba(6, 95, 70, 0.2);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .offline {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
    }
    .offline__icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline__icon svg {
      width: 36px;
      height: 36px;
      color: var(--green);
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    .offline__actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.25rem;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:active, a:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--green);
      color: #fff;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(107, 114, 128, 0.35);
    }
    .offline__status {
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .offline__status.is-online { color: var(--green); }
  </style>
</head>
<body>
  <main class="offline" role="alert">
    <div class="offline__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>JosRide needs an internet connection for live rides and payments. Cached pages may still be available.</p>
    <div class="offline__actions">
      <button type="button" class="btn-primary" id="offline-retry">Try again</button>
      <a href="/" class="btn-ghost">Go to home</a>
    </div>
    <p class="offline__status" id="offline-status" aria-live="polite">Waiting for connection…</p>
  </main>
  <script>
    (function () {
      var status = document.getElementById("offline-status");
      var retry = document.getElementById("offline-retry");

      function refresh() {
        if (navigator.onLine) {
          status.textContent = "Back online - reloading…";
          status.classList.add("is-online");
          window.location.reload();
          return;
        }
        status.textContent = "Still offline. Check your connection.";
        status.classList.remove("is-online");
      }

      retry.addEventListener("click", refresh);
      window.addEventListener("online", refresh);
    })();
  </script>
</body>
</html>
